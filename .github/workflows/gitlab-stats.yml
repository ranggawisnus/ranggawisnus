name: Generate GitLab stats

on:
  schedule:
    - cron: "17 18 * * *"  # 01:17 WIB harian
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render saja, tidak commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gitlab-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitLab aggregates
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python scripts/gitlab_stats.py

      - name: Commit & push
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: refresh GitLab aggregate stats"
            git push
          fi
